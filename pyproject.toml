[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relic-ising"
version = "0.1.0"
description = "Educational reproduction of RELIC Ising optimization via graph compression"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "networkx>=3.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["relic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
